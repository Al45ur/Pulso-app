<title>Pulso Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  /* Composición: una columna de teléfono (máx. 720 px) con barra de pestañas abajo; el personaje 3D es el protagonista
     de la ficha y del entrenamiento. Una sola identidad oscura (azul marino y verde neón), sin tema claro. */
  :root {
    --bg: #07111f;
    --panel: #0b1626;
    --panel-2: #0e1d31;
    --line: #1c3550;
    --text: #e8f0f8;
    --muted: #8fa6bf;
    --neon: #2ef2a0;
    --red: #ff4033;
    --orange: #ff9926;
    --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    padding-block: 12px 110px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button { font-family: inherit; }
  #app { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  #app > * { min-width: 0; }
  h1 { margin: 0; font: 700 30px/1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
  h1 span, .neon { color: var(--neon); }
  h2 { margin: 0; font: 700 22px/1.1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
  h3 { margin: 0 0 6px; font: 700 18px/1.1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
  .sub, .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

  .top { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .top .titulo { min-width: 0; }
  .top h2 { overflow-wrap: anywhere; }
  .icono { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); width: 40px; height: 40px;
    border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: none; }
  .icono svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; appearance: none; cursor: pointer; font: 600 13px/1 var(--font-body);
    color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px;
  }
  .chip[aria-pressed="true"], .chip.on { color: var(--bg); background: var(--neon); border-color: var(--neon); }
  .chip:focus-visible, button:focus-visible, input:focus-visible, .card.link:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }

  input[type="search"], input[type="number"] {
    width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font: 500 16px var(--font-body);
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
  .card.link { display: flex; gap: 12px; align-items: center; cursor: pointer; padding: 10px; color: inherit; text-align: left; width: 100%; font: inherit; }
  .card.link .info { min-width: 0; flex: 1; }
  .card.link .nombre { font-weight: 600; }
  .stack { display: grid; gap: 10px; }
  .thumb { width: 76px; height: 76px; border-radius: 12px; background: var(--panel-2); object-fit: cover; flex: none; display: block; }
  .thumb.grande { width: 96px; height: 96px; }

  .btn { appearance: none; border: 0; cursor: pointer; font: 600 16px/1 var(--font-body); border-radius: 14px; padding: 15px 18px;
    background: var(--neon); color: var(--bg); width: 100%; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.sec { background: var(--panel); color: var(--neon); border: 1px solid rgba(46, 242, 160, 0.6); }
  .btn.peligro { background: var(--panel); color: var(--red); border: 1px solid rgba(255, 64, 51, 0.6); }
  .fila { display: flex; gap: 10px; align-items: center; }
  .fila > .btn { flex: 1; }
  .wrap { flex-wrap: wrap; }
  .between { justify-content: space-between; }

  .stage {
    position: relative; border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 20%, #10253d 0%, var(--panel) 55%, #060e19 100%);
    height: min(56vh, 460px); min-height: 300px; touch-action: none;
  }
  .stage.corto { height: 240px; min-height: 0; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; left: 0; right: 0; display: flex; gap: 6px; padding: 10px; pointer-events: none; }
  .overlay > * { pointer-events: auto; }
  .overlay.top { top: 0; justify-content: space-between; align-items: flex-start; }
  .overlay.bottom { bottom: 0; justify-content: center; }
  .views { display: flex; gap: 6px; }
  .views .chip { padding: 8px 12px; background: rgba(11, 22, 38, 0.82); }
  .views .chip[aria-pressed="true"] { background: var(--neon); color: var(--bg); }
  .tip { max-width: 62%; background: rgba(11, 22, 38, 0.94); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
  .tip b { font: 700 17px var(--font-display); letter-spacing: 0.02em; display: block; }
  .tip small { color: var(--muted); display: block; margin-top: 2px; }
  .hint { font-size: 12px; color: var(--muted); background: rgba(11, 22, 38, 0.82); border-radius: 999px; padding: 6px 12px; }

  .play { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; background: var(--neon); color: var(--bg); display: grid; place-items: center; }
  .play svg { width: 22px; height: 22px; fill: currentColor; }
  input[type="range"] { flex: 1; min-width: 0; accent-color: var(--neon); height: 28px; }
  .phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
  .phases .chip { border-radius: 12px; text-align: center; }
  .speed { display: flex; gap: 6px; flex-wrap: wrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
  .tag .dot { margin: 0; }
  .muscles { display: flex; gap: 8px; flex-wrap: wrap; }
  .lista-num { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: paso; }
  .lista-num li { counter-increment: paso; display: flex; gap: 10px; align-items: flex-start; }
  .lista-num li::before { content: counter(paso); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--neon); color: var(--bg); font: 700 13px/24px var(--font-body); text-align: center; }
  .lista-pt { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
  .lista-pt.malo li::marker { color: var(--red); }
  .lista-pt.bueno li::marker { color: var(--neon); }
  .notes { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .error { color: var(--red); }

  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stepper .valor { display: flex; align-items: center; gap: 10px; }
  .stepper b { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; font-size: 17px; }
  .mini { appearance: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); color: var(--neon); font: 700 22px/1 var(--font-body); cursor: pointer; }
  .mini:disabled { opacity: 0.3; }

  .serie { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .serie:last-child { border-bottom: 0; }
  .progreso { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .progreso > i { display: block; height: 100%; background: var(--neon); }
  .descanso { text-align: center; }
  .descanso .num { font: 700 52px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .franja { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .franja button { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: var(--neon); color: var(--bg); border: 0; border-radius: 14px; padding: 12px 16px; font: 600 15px var(--font-body); cursor: pointer; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(7, 17, 31, 0.96); border-top: 1px solid var(--line);
    padding-top: 6px; padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .tabbar .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  .tabbar button { appearance: none; background: none; border: 0; color: var(--muted); display: grid; justify-items: center; gap: 3px; padding: 6px 0 8px; font: 600 11px var(--font-body); cursor: pointer; min-width: 0; }
  .tabbar button[aria-current="page"] { color: var(--neon); }
  .tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); z-index: 50;
    background: var(--neon); color: var(--bg); font-weight: 600; border-radius: 999px; padding: 10px 18px; max-width: 90vw; text-align: center; }
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(3, 8, 15, 0.78); display: grid; place-items: center; padding: 20px; }
  .modal .card { max-width: 380px; width: 100%; display: grid; gap: 14px; }
  .muscle-chip { display: inline-flex; align-items: center; gap: 6px; }
  .muscle-chip small { font-size: 11px; opacity: 0.75; }
  .muscle-chip.vacio { opacity: 0.55; border-style: dashed; }
  .fila-ej { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .fila-ej .info { min-width: 0; flex: 1; }
  .fila-ej .nombre { font-weight: 600; }
  .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .foto { position: relative; border: 2px solid transparent; border-radius: 12px; overflow: hidden; background: var(--panel-2); cursor: pointer; padding: 0; color: inherit; font: inherit; text-align: left; }
  .foto.sel { border-color: var(--neon); }
  .foto img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
  .foto span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; font-weight: 600; padding: 14px 6px 4px; background: linear-gradient(transparent, rgba(3, 8, 15, 0.9)); }
  .comparar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .comparar figure { margin: 0; display: grid; gap: 6px; }
  .comparar img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; background: var(--panel-2); }
  .comparar figcaption { font-size: 12px; color: var(--muted); }
  .guia-fig { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .guia-fig figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
  .guia-fig img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--panel-2); }
  input[type="date"] { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 500 16px var(--font-body); color-scheme: dark; }
  .estado { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="app"><div id="vista"></div></div>
<div id="franja" class="franja" hidden></div>
<nav class="tabbar" id="tabbar" aria-label="Secciones"><div class="in">
  <button data-ir="catalogo"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Ejercicios</button>
  <button data-ir="mapa"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.2"/><path d="M8 9h8l1.5 5h-2L15 21h-2.2L12 15l-.8 6H9l-.5-7h-2z"/></svg>Mapa</button>
  <button data-ir="rutinas"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Rutinas</button>
  <button data-ir="historial"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button>
  <button data-ir="progreso"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>Progreso</button>
</div></nav>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>

<script type="application/json" id="datos">__DATOS__</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const D = JSON.parse($("datos").textContent);
  const CATALOGO = D.ejercicios;
  const porId = (id) => CATALOGO.find((f) => f.id === id);
  const MUSCULO = {
    triceps: ["Tríceps", "Parte posterior del brazo; extiende el codo. Tiene tres cabezas (larga, lateral y medial)."],
    biceps: ["Bíceps", "Parte frontal del brazo; flexiona el codo y gira el antebrazo."],
    deltoides_anterior: ["Deltoides anterior", "Parte frontal del hombro; levanta el brazo hacia delante y participa en los press."],
    deltoides_lateral: ["Deltoides lateral", "Parte externa del hombro; separa el brazo hacia el lado y da anchura al hombro."],
    deltoides_posterior: ["Deltoides posterior", "Parte trasera del hombro; lleva el brazo hacia atrás y abre los hombros."],
    pectorales: ["Pectorales", "Músculos del pecho; acercan el brazo al cuerpo y lo empujan hacia delante."],
    dorsales: ["Dorsales", "Zona amplia de la espalda; lleva el brazo hacia abajo y hacia atrás."],
    trapecio: ["Trapecio", "Entre el cuello, los hombros y la espalda media; mueve y estabiliza los omóplatos."],
    lumbar: ["Zona lumbar", "Erectores espinales: mantienen la columna extendida y estable."],
    abdomen: ["Abdomen", "Estabiliza el tronco y flexiona la columna."],
    gluteos: ["Glúteos", "El glúteo mayor es el principal extensor de la cadera."],
    cuadriceps: ["Cuádriceps", "Parte frontal del muslo; extiende la rodilla."],
    isquiotibiales: ["Isquiotibiales", "Parte posterior del muslo; extienden la cadera y flexionan la rodilla."],
    gemelos: ["Gemelos", "Pantorrilla; empujan el pie hacia abajo."],
    antebrazos: ["Antebrazos", "Mueven la muñeca y los dedos y sostienen el agarre."],
    aductores: ["Aductores", "Parte interna del muslo; acercan la pierna al cuerpo."]
  };
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v, min, max, def) => { v = Number(v); return Number.isFinite(v) ? Math.min(Math.max(v, min), max) : def; };
  const fmtKg = (v) => (Math.round(v * 10) / 10).toLocaleString("es", { maximumFractionDigits: 1 });
  const fmtFecha = (ms) => new Date(ms).toLocaleString("es", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const fmtMin = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  /* =====================  ALMACÉN  =====================
     Con sesión de claude.ai se guarda en la cuenta (db, subárbol privado data/users/<id>/); si no, en este navegador. */
  const Almacen = {
    modo: "local", db: null, uid: null,
    async iniciar() {
      try {
        if (!window.claude || !window.claude.use) return;
        const user = await window.claude.use("user"), db = await window.claude.use("db");
        const uid = user ? await user.id() : null;
        if (db && uid) { this.db = db; this.uid = uid; this.modo = "nube"; }
      } catch (e) { /* se queda en modo local */ }
    },
    refEstado() { return this.db.doc("data/users/" + this.uid + "/estado"); },
    refHistorial() { return this.refEstado().collection("historial"); },
    leerLocal(clave, def) { try { const v = localStorage.getItem(clave); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
    escribirLocal(clave, v) { try { localStorage.setItem(clave, JSON.stringify(v)); return true; } catch (e) { return false; } },
    async cargarEstado() {
      if (this.modo === "nube") { const s = await this.refEstado().get(); return s.exists ? s.data() : null; }
      return this.leerLocal("pulso.estado", null);
    },
    async guardarEstado(estado) {
      if (this.modo === "nube") { await this.refEstado().set(estado); return; }
      this.escribirLocal("pulso.estado", estado);
    },
    async listarSesiones() {
      if (this.modo === "nube") {
        const q = await this.refHistorial().orderBy("inicio", "desc").limit(100).get();
        return q.docs.map((d) => ({ ...d.data(), id: d.id }));
      }
      return this.leerLocal("pulso.historial", []).sort((a, b) => b.inicio - a.inicio);
    },
    async agregarSesion(s) {
      if (this.modo === "nube") { await this.refHistorial().doc(s.id).set(s); return; }
      const l = this.leerLocal("pulso.historial", []); l.push(s); this.escribirLocal("pulso.historial", l);
    },
    /* Fotos de progreso: en la cuenta (un documento por foto, <256 KiB) o en IndexedDB del navegador. */
    refFotos() { return this.refEstado().collection("fotos"); },
    idb() {
      if (this._idb) return this._idb;
      this._idb = new Promise((res, rej) => {
        try {
          const r = indexedDB.open("pulso-fotos", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("fotos", { keyPath: "id" });
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error || new Error("IndexedDB no disponible"));
        } catch (e) { rej(e); }
      });
      return this._idb;
    },
    async idbOp(modo, fn) {
      const db = await this.idb();
      return new Promise((res, rej) => { const tx = db.transaction("fotos", modo), r = fn(tx.objectStore("fotos")); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
    },
    async listarFotos() {
      if (this.modo === "nube") { const q = await this.refFotos().orderBy("fecha", "desc").limit(200).get(); return q.docs.map((d) => ({ ...d.data(), id: d.id })); }
      return (await this.idbOp("readonly", (st) => st.getAll())) || [];
    },
    async agregarFoto(f) {
      if (this.modo === "nube") { await this.refFotos().doc(f.id).set(f); return; }
      await this.idbOp("readwrite", (st) => st.put(f));
    },
    async borrarFoto(id) {
      if (this.modo === "nube") { await this.refFotos().doc(id).delete(); return; }
      await this.idbOp("readwrite", (st) => st.delete(id));
    },
    async borrarSesion(id) {
      if (this.modo === "nube") { await this.refHistorial().doc(id).delete(); return; }
      this.escribirLocal("pulso.historial", this.leerLocal("pulso.historial", []).filter((s) => s.id !== id));
    }
  };

  /* =====================  ESTADO  ===================== */
  const S = {
    vista: { t: "catalogo" }, pila: [], busqueda: "", categoria: null,
    estado: { v: 1, miRutina: [], config: {}, activa: null },
    historial: [], fotos: [], fotosListas: false, mapa: { sel: null, az: 0 },
    progreso: { vista: "frente", filtro: null, cmp: [], guia: false, fecha: "" },
    listo: false, abiertas: {}, tabDetalle: "animacion", vistaAnatomia: 180, errorAlmacen: null
  };
  const sugerida = (f) => ({ series: f.series, repsMin: f.repsMin, repsMax: f.repsMax, descanso: f.descansoSeg });
  function validaConfig(c) {
    return c && Number.isInteger(c.series) && c.series >= 1 && c.series <= 10 && Number.isInteger(c.repsMin) && c.repsMin >= 1 &&
      Number.isInteger(c.repsMax) && c.repsMax <= 50 && c.repsMin <= c.repsMax && Number.isInteger(c.descanso) && c.descanso >= 0 && c.descanso <= 600;
  }
  const getConfig = (f) => { const c = S.estado.config[f.id]; return validaConfig(c) ? c : sugerida(f); };
  let guardando = null, pendiente = false;
  function guardar() {

    if (hay3D && E.montado && R.ficha && E.modo === "ejercicio") {
      if (R.reproduciendo) { R.tiempo = (R.tiempo + dt * R.velocidad) % durF(R.ficha); }
      E.aplicar(poseEn(R.ficha, R.tiempo));
      actualizarControles();
    }
    if (hay3D && E.montado) E.dibujar();
    requestAnimationFrame(bucle);
  }
  function actualizarControles() {
    const f = R.ficha, seek = $("seek"); if (!f || !seek) return;
    const fase = faseCercana(f, R.tiempo);
    if (document.activeElement !== seek) seek.value = Math.round((((R.tiempo % durF(f)) + durF(f)) % durF(f)) / durF(f) * 1000);
    if (fase !== R.faseMostrada) {
      R.faseMostrada = fase;
      document.querySelectorAll("#phases .chip").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.fase) === fase)));
      const d = $("faseDesc"); if (d) d.innerHTML = "<b>" + esc(f.fases[fase].nombre) + ".</b> " + esc(f.fases[fase].descripcion);
    }
    const p = $("play"); if (p) { const icono = R.reproduciendo ? ICONO_PAUSA : ICONO_PLAY; if (p.dataset.i !== String(R.reproduciendo)) { p.innerHTML = icono; p.dataset.i = String(R.reproduciendo); } }
  }

  /* =====================  VISTAS  ===================== */
  const ICO = {
    atras: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    mas: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    reiniciar: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>'
  };
  const thumb = (f, fase, grande) => '<img class="thumb' + (grande ? " grande" : "") + '" alt="" data-thumb="' + f.id + "#" + (fase == null ? f.faseMiniatura : fase) + '">';
  const chipsMusculos = (f) => '<div class="muscles">' +
    f.musculosPrincipales.map((m) => '<span class="tag"><i class="dot" style="background:var(--red)"></i>' + MUSCULO[m][0] + "</span>").join("") +
    f.musculosSecundarios.map((m) => '<span class="tag"><i class="dot" style="background:var(--orange)"></i>' + MUSCULO[m][0] + "</span>").join("") + "</div>";
  const stepper = (etq, valor, cual, min, max) => '<div class="stepper"><span class="muted">' + etq + '</span><span class="valor"><button class="mini" data-cfg="' + cual + '" data-d="-1" aria-label="Menos ' + etq + '"' + (valor <= min ? " disabled" : "") + '>−</button><b>' + valor + '</b><button class="mini" data-cfg="' + cual + '" data-d="1" aria-label="Más ' + etq + '"' + (valor >= max ? " disabled" : "") + ">+</button></span></div>";
  const estadoAlmacen = () => '<div class="estado"><i class="dot" style="background:' + (S.listo ? (Almacen.modo === "nube" ? "var(--neon)" : "var(--orange)") : "var(--muted)") + '"></i>' +
    (!S.listo ? "Cargando tus datos…" : Almacen.modo === "nube" ? "Guardado en tu cuenta" : "Guardado solo en este navegador") + "</div>";

  function vCatalogo() {
    const cats = [...new Set(CATALOGO.map((f) => f.categoria))];
    return '<div class="top"><div><h1>Pulso <span>Gym</span></h1><div class="sub small">Ejercicios con personaje 3D</div></div></div>' +
      '<input id="buscar" type="search" placeholder="Buscar ejercicio o músculo" value="' + esc(S.busqueda) + '" aria-label="Buscar">' +

      '<div class="stack" id="lista">' + listaCatalogo() + "</div>" + estadoAlmacen();
  }
  function listaCatalogo() {
    const q = S.busqueda.trim().toLowerCase();
    const l = CATALOGO.filter((f) => (S.categoria === null || f.categoria === S.categoria) &&
      (!q || f.nombre.toLowerCase().includes(q) || f.musculosPrincipales.some((m) => MUSCULO[m][0].toLowerCase().includes(q)) || f.equipo.toLowerCase().includes(q)));

  }

  function vDetalle() {

    let cuerpo = "";
    if (S.tabDetalle === "animacion") {
      cuerpo = '<div class="stage" id="stage"><div class="overlay top"><div class="views"><button class="chip" data-vista="0">Frente</button><button class="chip" data-vista="90">Perfil</button><button class="chip" data-vista="180">Espalda</button></div>' +
        '<button class="icono" data-accion="camara" aria-label="Restablecer cámara">' + ICO.reiniciar + '</button></div><div class="overlay bottom"><span class="hint">Arrastra para girar</span></div></div>' +
        '<section class="card stack"><div class="fila"><button class="play" id="play" data-accion="play" aria-label="Reproducir o pausar"></button><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Progreso"></div>' +
        '<div class="phases" id="phases">' + f.fases.map((fa, i) => '<button class="chip" data-fase="' + i + '" aria-pressed="false">' + (i + 1) + ". " + esc(fa.nombre) + "</button>").join("") + "</div>" +
        '<div class="speed" id="speed">' + [0.25, 0.5, 1, 1.5, 2].map((v) => '<button class="chip" data-vel="' + v + '" aria-pressed="' + (v === R.velocidad) + '">' + v + "×</button>").join("") + "</div>" +
        '<p class="muted" id="faseDesc" style="margin:0"></p></section>' +
        '<section class="card"><div class="eyebrow">Músculos del ejercicio</div>' + chipsMusculos(f) + "</section>";
    } else if (S.tabDetalle === "anatomia") {
      cuerpo = '<div class="stage" id="stage"><div class="overlay top"><div class="views"><button class="chip" data-vista="0" aria-pressed="' + (S.vistaAnatomia === 0) + '">Frente</button><button class="chip" data-vista="90" aria-pressed="' + (S.vistaAnatomia === 90) + '">Perfil</button><button class="chip" data-vista="180" aria-pressed="' + (S.vistaAnatomia === 180) + '">Espalda</button></div><div class="tip" id="tip" hidden></div></div>' +
        '<div class="overlay bottom"><span class="hint">Toca un músculo</span></div></div>' +
        '<section class="card"><div class="legend"><span><i class="dot" style="background:var(--red)"></i>Principal</span><span><i class="dot" style="background:var(--orange)"></i>Secundario</span><span><i class="dot" style="background:#4d6687"></i>Sin relación</span></div>' +
        f.musculosPrincipales.concat(f.musculosSecundarios).map((m) => '<p style="margin:0 0 10px"><b>' + MUSCULO[m][0] + '</b> <span class="small muted">· ' + (f.musculosPrincipales.includes(m) ? "principal" : "secundario") + "</span><br><span class=\"small muted\">" + MUSCULO[m][1] + "</span></p>").join("") +
        '<p class="small muted" style="margin:0">Visualización educativa: marca los músculos asociados al ejercicio. No mide la activación real ni es una valoración médica.</p></section>';
    } else if (S.tabDetalle === "tecnica") {
      cuerpo = '<section class="card stack"><div><h3>Descripción</h3><div class="muted">' + esc(f.descripcion) + '</div></div><div class="small muted">Equipo: ' + esc(f.equipo) + "</div></section>" +
        '<section class="card"><h3>Paso a paso</h3><ol class="lista-num">' + f.pasos.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ol></section>" +
        '<section class="card"><h3 style="color:var(--red)">Errores comunes</h3><ul class="lista-pt malo">' + f.errores.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul></section>" +
        '<section class="card"><h3>Seguridad</h3><ul class="lista-pt bueno">' + f.seguridad.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul></section>" +
        '<section class="card"><div class="eyebrow">Pendiente de validar</div><ul class="notes">' + f.pendienteValidacion.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul></section>";
    } else {
      cuerpo = f.fases.map((fa, i) => '<div class="card link" style="cursor:default">' + thumb(f, i, true) + '<div class="info"><div class="eyebrow">Fase ' + (i + 1) + ' de ' + f.fases.length + '</div><div class="nombre">' + esc(fa.nombre) + '</div><div class="small muted">' + esc(fa.descripcion) + '</div><button class="chip" style="margin-top:8px" data-verfase="' + i + '">Ver en 3D</button></div></div>').join("");

      '<div class="tabs" id="pestanas">' + tabs.map(([k, t]) => '<button class="chip" data-tab="' + k + '" aria-pressed="' + (S.tabDetalle === k) + '">' + t + "</button>").join("") + "</div>" + cuerpo +
      '<section class="card stack"><div class="eyebrow">Tu objetivo</div>' + stepper("Series", cfg.series, "series", 1, 10) + stepper("Repeticiones mín.", cfg.repsMin, "repsMin", 1, cfg.repsMax) +

  function vRutinas() {

      '<div class="stack">' + r.items.map((it) => { const f = porId(it.f); return '<div class="card link" style="padding:10px">' + thumb(f) + '<button class="info" data-abrir="' + f.id + '" style="all:unset;cursor:pointer;flex:1;min-width:0"><div class="nombre">' + esc(f.nombre) + '</div><div class="small muted">' + it.series + " × " + it.repsMin + "–" + it.repsMax + " · descanso " + it.descanso + " s</div></button>" +
        (r.fija ? "" : '<button class="icono" data-quitar="' + f.id + '" aria-label="Quitar ' + esc(f.nombre) + '"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>') + "</div>"; }).join("") + "</div>" +
      '<button class="btn" data-iniciar="' + r.id + '"' + (r.items.length ? "" : " disabled") + ">" + (S.estado.activa && S.estado.activa.rid === r.id ? "Continuar entrenamiento" : "Iniciar entrenamiento") + "</button>" +
      '<p class="small muted">Series, repeticiones y descansos son valores sugeridos; ajústalos a tu nivel.</p>';
  }

  /* ---------- Mapa del cuerpo ---------- */
  const ejerciciosDe = (m) => ({ pr: CATALOGO.filter((f) => f.musculosPrincipales.includes(m)), se: CATALOGO.filter((f) => f.musculosSecundarios.includes(m)) });
  const MUSCULOS_POSTERIORES = new Set(["triceps", "dorsales", "trapecio", "lumbar", "gluteos", "isquiotibiales", "gemelos", "deltoides_posterior"]);
  function panelMusculo() {
    const m = S.mapa.sel;
    if (!m) return '<div class="muted">Toca un músculo del muñeco, o elígelo en la lista de abajo, para ver qué ejercicios lo trabajan.</div>';
    const { pr, se } = ejerciciosDe(m);
    const fila = (f, rol, color) => '<button class="fila-ej" data-abrir="' + f.id + '"><i class="dot" style="background:' + color + ';margin:0"></i><span class="info"><span class="nombre" style="display:block">' + esc(f.nombre) + '</span><span class="small muted">' + esc(f.categoria) + " · " + rol + '</span></span><span class="neon">›</span></button>';
    return '<h3>' + MUSCULO[m][0] + '</h3><div class="muted" style="margin-bottom:10px">' + MUSCULO[m][1] + "</div>" +
      (pr.length + se.length ? '<div class="eyebrow">' + pr.length + " principal" + (pr.length === 1 ? "" : "es") + " · " + se.length + " secundario" + (se.length === 1 ? "" : "s") + '</div><div class="stack">' +
        pr.map((f) => fila(f, "Principal", "var(--red)")).join("") + se.map((f) => fila(f, "Secundario", "var(--orange)")).join("") + "</div>"
        : '<div class="card" style="background:var(--panel-2)">Aún no hay ejercicios para este músculo en el catálogo. Cuando agregues uno aparecerá aquí.</div>') +

  }
  function vMapa() {
    const cuenta = (m) => { const e = ejerciciosDe(m); return e.pr.length; };
    const sinPrincipal = Object.keys(MUSCULO).filter((m) => cuenta(m) === 0);

    return '<div class="top"><div><h2>Mapa del cuerpo</h2><div class="small muted">Toca un músculo y mira sus ejercicios</div></div></div>' +
      '<div class="stage" id="stage"><div class="overlay top"><div class="views">' + [[0, "Frente"], [90, "Perfil"], [180, "Espalda"]].map(([a, t]) => '<button class="chip" data-vista="' + a + '" aria-pressed="' + (az === a) + '">' + t + "</button>").join("") + '</div>' +
      '<button class="icono" data-accion="camara" aria-label="Restablecer cámara">' + ICO.reiniciar + '</button></div><div class="overlay bottom"><span class="hint">Toca un músculo · arrastra para girar</span></div></div>' +
      '<section class="card" id="panelMusculo">' + panelMusculo() + "</section>" +
      '<section class="card"><div class="eyebrow">Todos los músculos</div><div class="muscles">' +
      Object.keys(MUSCULO).map((m) => '<button class="chip muscle-chip' + (cuenta(m) ? "" : " vacio") + '" data-musculo="' + m + '" aria-pressed="' + (S.mapa.sel === m) + '">' + MUSCULO[m][0] + " <small>" + cuenta(m) + "</small></button>").join("") + "</div>" +
      '<p class="small muted" style="margin:10px 0 0">El número es la cantidad de ejercicios del catálogo donde ese músculo es principal. ' +

      '<p class="small muted">' + "Visualización educativa: relaciona cada músculo con los ejercicios del catálogo. No mide activación real ni es una valoración médica.</p>";
  }
  function seleccionarMusculo(m) {
    S.mapa.sel = m;
    if (m && hay3D) {
      const az = S.mapa.az;
      const nuevo = MUSCULOS_POSTERIORES.has(m) ? (az === 0 ? 180 : az) : (m === "deltoides_lateral" || m === "antebrazos") ? az : (az === 180 ? 0 : az);
      if (nuevo !== az) { S.mapa.az = nuevo; E.vista(nuevo); document.querySelectorAll(".views [data-vista]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.vista) === nuevo))); }
    }

    const p = $("panelMusculo"); if (p) p.innerHTML = panelMusculo();
    document.querySelectorAll("[data-musculo]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.musculo === m)));
  }

  /* ---------- Progreso fotográfico ---------- */
  const hoyISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const msDeISO = (iso) => { const [a, m, d] = iso.split("-").map(Number); return new Date(a, m - 1, d, 12).getTime(); };
  const fmtDia = (ms) => new Date(ms).toLocaleDateString("es", { day: "numeric", month: "short", year: "numeric" });
  const VISTAS_FOTO = [["frente", "Frente"], ["perfil", "Perfil"], ["espalda", "Espalda"]];
  const nombreVista = (v) => (VISTAS_FOTO.find((x) => x[0] === v) || [0, v])[1];
  const fotosOrdenadas = () => S.fotos.slice().sort((a, b) => b.fecha - a.fecha || (b.id > a.id ? 1 : -1));
  function vProgreso() {
    const P = S.progreso; if (!P.fecha) P.fecha = hoyISO();
    const lista = fotosOrdenadas().filter((f) => !P.filtro || f.vista === P.filtro);
    const elegidas = P.cmp.map((id) => S.fotos.find((f) => f.id === id)).filter(Boolean).sort((a, b) => a.fecha - b.fecha);
    let cmp = "";
    if (elegidas.length === 2) {
      const [a, b] = elegidas, dias = Math.round((b.fecha - a.fecha) / 86400000);
      cmp = '<section class="card stack"><div class="eyebrow">Comparación</div><div class="comparar">' +
        elegidas.map((f, i) => '<figure><img src="' + f.img + '" alt="' + (i ? "Después" : "Antes") + ': ' + nombreVista(f.vista) + '"><figcaption><b>' + (i ? "Después" : "Antes") + "</b> · " + fmtDia(f.fecha) + " · " + nombreVista(f.vista) + "</figcaption></figure>").join("") + "</div>" +
        '<div class="small muted">' + (dias === 0 ? "Mismo día." : dias + " día" + (dias === 1 ? "" : "s") + " de diferencia.") + (a.vista !== b.vista ? " Ojo: son vistas distintas (" + nombreVista(a.vista) + " y " + nombreVista(b.vista) + "); compara la misma vista." : "") + "</div>" +
        '<button class="btn sec" data-accion="limpiarcmp">Quitar comparación</button></section>';
    } else if (elegidas.length === 1) cmp = '<section class="card muted small">Elige una segunda foto con «Comparar» para verlas lado a lado.</section>';
    const guia = P.guia ? '<div class="stack"><div class="guia-fig">' + [[0, "Frente"], [90, "Perfil"], [180, "Espalda"]].map(([a, t]) => '<figure><img alt="Pose de ' + t + '" data-snap="' + a + '">' + t + "</figure>").join("") + "</div>" +
      '<ul class="lista-pt bueno"><li>Misma hora del día y misma luz (de preferencia luz natural frontal, sin filtros).</li><li>Misma distancia (unos 2 m) con la cámara a la altura del pecho o el ombligo.</li><li>Mismo fondo liso y ropa parecida (shorts ajustados).</li><li>Pies a la anchura de la cadera, brazos relajados a los lados, mirada al frente.</li><li>Postura natural: sin flexionar ni contraer; de perfil, brazos ligeramente adelantados.</li><li>Cada 2–4 semanas, en las mismas condiciones (por ejemplo, en ayunas por la mañana).</li></ul></div>' : "";
    return '<div class="top"><div><h2>Evolución fotográfica</h2><div class="small muted">Frente, perfil y espalda por fecha</div></div></div>' +
      '<section class="card stack"><div class="eyebrow">Añadir foto</div><div class="tabs" id="vistaFoto">' + VISTAS_FOTO.map(([k, t]) => '<button class="chip" data-vfoto="' + k + '" aria-pressed="' + (P.vista === k) + '">' + t + "</button>").join("") + "</div>" +
      '<label class="small muted" for="fechaFoto">Fecha de la foto</label><input id="fechaFoto" type="date" value="' + P.fecha + '" max="' + hoyISO() + '">' +
      '<input id="archivoFoto" type="file" accept="image/*" hidden><button class="btn" data-accion="elegirfoto"' + (S.fotosListas ? "" : " disabled") + '>Tomar o elegir foto</button>' +
      '<div class="small muted">Tu foto se reduce de tamaño y se guarda ' + (Almacen.modo === "nube" ? "solo en tu cuenta (privada)" : "solo en este navegador") + '. No se analiza el cuerpo con IA ni se comparte con nadie.</div></section>' +
      '<section class="card stack"><button class="chip" style="justify-self:start" data-accion="guia" aria-pressed="' + P.guia + '">Guía para repetir la pose</button>' + guia + "</section>" +
      cmp +

      c[d.cfg] = c[d.cfg] + Number(d.d) * paso;
      if (d.cfg === "repsMin" && c.repsMin > c.repsMax) c.repsMax = c.repsMin;
      if (d.cfg === "repsMax" && c.repsMax < c.repsMin) c.repsMin = c.repsMax;
      if (!validaConfig(c)) return;
      S.estado.config[f.id] = c;
      const i = S.estado.miRutina.find((x) => x.f === f.id); void i;
      guardar(); return render(false);
    }
    if (d.quitar) { if (!S.listo) return aviso("Cargando tus datos…"); const f = porId(d.quitar); S.estado.miRutina = S.estado.miRutina.filter((i) => i.f !== d.quitar); guardar(); aviso("Quitado: " + f.nombre); return render(false); }
    if (d.sesion) { S.abiertas[d.sesion] = !S.abiertas[d.sesion]; return render(false); }
    if (d.borrar) {
      if (!(await confirmar("¿Borrar este entrenamiento del historial? No se puede deshacer.", "Borrar", true))) return;
      try { await Almacen.borrarSesion(d.borrar); S.historial = S.historial.filter((s) => s.id !== d.borrar); aviso("Entrenamiento borrado"); render(false); }
      catch (er) { aviso("No se pudo borrar: " + ((er && er.message) || "error")); }
      return;
    }
    if (d.peso) { const el = $("peso"); if (el) { el.value = Math.round(num(Number(el.value) + Number(d.peso), 0, 500, 0) * 10) / 10; S.estado.activa.peso = Number(el.value); } return; }
    if (d.reps) { const a = S.estado.activa; a.reps = num(a.reps + Number(d.reps), 1, 100, a.reps); $("reps").textContent = a.reps; return; }
    switch (d.accion) {
      case "atras": return atras();
      case "elegirfoto": { const i = $("archivoFoto"); if (i) i.click(); return; }
      case "guia": S.progreso.guia = !S.progreso.guia; return render(false);
      case "limpiarcmp": S.progreso.cmp = []; return render(false);
      case "exportar": {
        const reg = { app: "Pulso Gym", exportado: new Date().toISOString(), fotos: fotosOrdenadas().map((f) => ({ id: f.id, fecha: new Date(f.fecha).toISOString().slice(0, 10), vista: f.vista })) };
        return guardarArchivo("pulso-progreso.json", JSON.stringify(reg, null, 2));
      }
      case "borrartodas": {
        if (!(await confirmar("¿Borrar TODAS tus fotos de progreso? No se puede deshacer.", "Borrar todo", true))) return;
        try { for (const f of S.fotos.slice()) await Almacen.borrarFoto(f.id); S.fotos = []; S.progreso.cmp = []; S.progreso.abierta = null; aviso("Fotos borradas"); }
        catch (er) { aviso("No se pudieron borrar todas: " + ((er && er.message) || "error")); S.fotosListas = false; cargarFotos(); }
        return render(false);
      }
      case "play": R.reproduciendo = !R.reproduciendo; return;
      case "camara": return hay3D && E.reiniciarCamara();
      case "agregar": case "actualizar": {
        if (!S.listo) return aviso("Cargando tus datos…");
        const f = porId(S.vista.id), c = getConfig(f), i = S.estado.miRutina.findIndex((x) => x.f === f.id);
        const item = { f: f.id, series: c.series, repsMin: c.repsMin, repsMax: c.repsMax, descanso: c.descanso };
        if (i >= 0) S.estado.miRutina[i] = item; else S.estado.miRutina.push(item);
        guardar(); aviso(d.accion === "agregar" ? "Añadido a Mi rutina" : "Actualizado en Mi rutina"); return render(false);
      }
      case "quitar": { const f = porId(S.vista.id); S.estado.miRutina = S.estado.miRutina.filter((x) => x.f !== f.id); guardar(); aviso("Quitado de Mi rutina"); return render(false); }
      case "continuar": return ir({ t: "sesion" });
      case "minimizar": return atras();
      case "registrar": return registrarSerie();
      case "anterior": return moverEjercicio(-1);
      case "siguiente": return moverEjercicio(1);
      case "terminar": return terminarSesion();
      case "omitir": { const a = S.estado.activa; if (a) { a.descansoFin = null; guardar(); } return; }
    }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "buscar") { S.busqueda = e.target.value; const l = $("lista"); if (l) { l.innerHTML = listaCatalogo(); pedirMiniaturas(); } }
    else if (e.target.id === "seek") { R.reproduciendo = false; R.tiempo = (Number(e.target.value) / 1000) * durF(R.ficha); }
    else if (e.target.id === "peso") { const a = S.estado.activa; if (a) a.peso = Number(e.target.value); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "fechaFoto") { S.progreso.fecha = e.target.value || hoyISO(); return; }
    if (e.target.id === "archivoFoto") { const a = e.target.files && e.target.files[0]; e.target.value = ""; agregarFotoDesdeArchivo(a); return; } if (e.target.id === "peso" && S.estado.activa) guardar(); });

  /* =====================  ARRANQUE  ===================== */
  render(false);
  requestAnimationFrame(bucle);
  (async function cargar() {
    await Almacen.iniciar();
    try {
      const guardado = await Almacen.cargarEstado();
      if (guardado && guardado.v === 1) {
        S.estado = { v: 1, miRutina: Array.isArray(guardado.miRutina) ? guardado.miRutina : [], config: guardado.config && typeof guardado.config === "object" ? guardado.config : {}, activa: guardado.activa || null };
      }
      S.historial = await Almacen.listarSesiones();
    } catch (er) { S.errorAlmacen = (er && er.message) || "error"; aviso("No se pudieron leer tus datos guardados."); }
    S.listo = true;
    if (S.vista.t === "progreso") cargarFotos();
    if (S.estado.activa && S.vista.t !== "sesion") { /* la franja «Continuar» aparece sola */ }
    render(false);
  })();
})();
</script>
