name: Pulso
options:
  bundleIdPrefix: com.pulso
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pulso:
    type: application
    platform: iOS
    sources:
      - Pulso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulso.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulso
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  PulsoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PulsoTests
    dependencies:
      - target: Pulso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulso.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pulso:
    build:
      targets:
        Pulso: all
    test:
      targets:
        - PulsoTests
